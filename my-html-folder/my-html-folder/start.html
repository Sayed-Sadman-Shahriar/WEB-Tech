<html>
	<head>
		<title>PAGE_01</title>
		<link rel="stylesheet" href="style.css">

		<script>
		function validateForm() 
		{

			let name = document.forms["regForm"]["name"].value;
			let gender = document.querySelector('input[name="gender"]:checked');
			let country = document.forms["regForm"]["country"].value;
			let dob = document.forms["regForm"]["dob"].value;

			if(name=="" || !gender || country=="" || dob=="")
			{
			alert("All fields are required");
			return false;
			}

			let birthDate = new Date(dob);
			let today = new Date();

			let age = today.getFullYear() - birthDate.getFullYear();

			if(today.getMonth() < birthDate.getMonth())
			{
				age--;
			}

			if(age < 5)
			{
				alert("Age must be 5 years or above");
				return false;
			}

			if(country != "Bangladesh")
			{
				alert("Only Bangladesh allowed");
				return false;
			}

			return true;
		}
		</script>
		
	</head>

	<body>

		<div class="card">

		<h2>Registration Page 01</h2>

		<form name="regForm" action="eligibility.php" method="POST" onsubmit="return validateForm()">

		<label>Name</label>
		<input type="text" name="name">

		<label>Gender</label>

		<div class="gender-box">
		<label class="radio-label">
		<input type="radio" name="gender" value="Male"> Male
		</label>

		<label class="radio-label">
		<input type="radio" name="gender" value="Female"> Female
		</label>
		</div>

		<label>Address</label>
		<input type="text" name="address">

		<label>Division</label>
		<select name="division">
		<option value="">Select Division</option>
		<option>Dhaka</option>
		<option>Chattogram</option>
		<option>Rajshahi</option>
		<option>Khulna</option>
		<option>Barishal</option>
		<option>Sylhet</option>
		<option>Rangpur</option>
		<option>Mymensingh</option>
		</select>

		<label>Country</label>
		<select name="country">
		<option value="">Select Country</option>
		<option>Bangladesh</option>
		<option>Pakistan</option>
		<option>Nepal</option>
		<option>Bhutan</option>
		<option>China</option>
		<option>Iran</option>
		<option>America</option>
		<option>England</option>
		<option>Australia</option>
		<option>India</option>
		</select>

		<label>Date of Birth</label>
		<input type="date" name="dob">

		<button type="submit">Check Eligibility</button>

		</form>

		</div>

	</body>

</html>
